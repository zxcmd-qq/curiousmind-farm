name: Публикация по расписанию (прайм-тайм)

on:
  schedule:
    - cron: '0 9 * * *'    # 12:00 МСК
    - cron: '0 15 * * *'   # 18:00 МСК
    - cron: '0 18 * * *'   # 21:00 МСК
  workflow_dispatch:

concurrency:
  group: state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PAT: ${{ secrets.GH_PAT }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
      TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
      TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
      TG_CHANNEL_BOT_TOKEN: ${{ secrets.TG_CHANNEL_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Взять первый из очереди
        id: q
        run: |
          ID=$(grep -m1 . state/publish-queue.txt 2>/dev/null || true)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          [ -n "$ID" ] && sed -i "0,/^$ID\$/{//d}" state/publish-queue.txt || echo "очередь пуста"
      - name: Публикация на все площадки
        if: steps.q.outputs.id != ''
        run: PYTHONPATH=pipeline python pipeline/publish.py "${{ steps.q.outputs.id }}"
      - name: Вернуть в очередь, если всё упало
        if: failure() && steps.q.outputs.id != ''
        run: echo "${{ steps.q.outputs.id }}" >> state/publish-queue.txt
      - name: Сохранить
        if: always()
        run: |
          git config user.name "curiousmind-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -q -m "published" && git pull -q --rebase && git push -q)
